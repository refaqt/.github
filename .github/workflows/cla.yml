#
# Contributor agreement check, shared by every Refaqt repository.
#
# A repository calls this workflow from its own small file (see
# workflow-templates/contributor-agreement.yml). The check:
#   1. lists the GitHub accounts of everyone who made a commit in the pull request;
#   2. reads the signature list from this repository (branch `cla-signatures`);
#   3. if the event is the signing comment, adds the commenter to the list;
#   4. sets the commit status "Contributor agreement" and posts one comment that it keeps up to date.
#
# Safety: this workflow never checks out or runs code from the pull request. Comment text is only
# compared with a fixed sentence.

name: Contributor agreement (shared)

on:
  workflow_call:
    secrets:
      CLA_SIGNATURES_TOKEN:
        description: "Fine-grained token with Contents read and write on refaqt/.github only."
        required: false

env:
  AGREEMENT_VERSION: "1.0"
  AGREEMENT_URL: https://github.com/refaqt/.github/blob/main/CLA.md
  ENTITY_URL: https://github.com/refaqt/.github/blob/main/CLA-entity.md
  MANUAL_URL: https://github.com/refaqt/.github/blob/main/CONTRIBUTING.md
  SIGN_SENTENCE: "I have read the Refaqt Contributor Licence Agreement version 1.0 and I agree to it."
  SIGNATURE_OWNER: refaqt
  SIGNATURE_REPO: .github
  SIGNATURE_BRANCH: cla-signatures
  SIGNATURE_FILE: signatures/cla-v1.json
  ENTITY_FILE: signatures/entities.json
  STATUS_CONTEXT: Contributor agreement

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Find the contributors of this pull request
        id: authors
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.payload.pull_request
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr_number });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr_number, per_page: 100 });

            const accounts = new Map();   // id -> login
            const unlinked = new Set();   // "Name <email>" of commits without a GitHub account
            // AI coding assistants cannot sign a contract. A person runs them and opens the pull
            // request, so their commits count as that person's work: the pull request author
            // must have accepted the agreement instead.
            const AI_LOGINS = new Set(['claude', 'cursoragent', 'copilot', 'copilot-swe-agent', 'devin-ai-integration']);
            const AI_EMAILS = [/@anthropic\.com$/i, /@cursor\.com$/i, /copilot/i];
            const isAi = (login, email) =>
              (login && AI_LOGINS.has(login.toLowerCase())) ||
              (email && AI_EMAILS.some(r => r.test(email)));
            let aiCommits = false;
            for (const c of commits) {
              const a = c.commit.author || {};
              if (c.author && c.author.id) {
                if (c.author.type === 'Bot' || c.author.login.endsWith('[bot]')) continue;
                if (isAi(c.author.login, a.email)) { aiCommits = true; continue; }
                accounts.set(String(c.author.id), c.author.login);
              } else if (isAi(null, a.email)) {
                aiCommits = true;
              } else {
                unlinked.add(`${a.name || 'unknown'} <${a.email || 'no email'}>`);
              }
            }
            if (aiCommits && pr.user && pr.user.type !== 'Bot') {
              accounts.set(String(pr.user.id), pr.user.login);
            }

            let signer = null;
            if (context.eventName === 'issue_comment') {
              const body = (context.payload.comment.body || '').trim();
              if (body === process.env.SIGN_SENTENCE) {
                const u = context.payload.comment.user;
                signer = { id: String(u.id), login: u.login,
                           comment_url: context.payload.comment.html_url };
              }
            }

            core.setOutput('pr_number', String(pr_number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('accounts', JSON.stringify([...accounts].map(([id, login]) => ({ id, login }))));
            core.setOutput('unlinked', JSON.stringify([...unlinked]));
            core.setOutput('signer', JSON.stringify(signer));

      - name: Read and update the signature list
        id: signatures
        uses: actions/github-script@v7
        env:
          ACCOUNTS: ${{ steps.authors.outputs.accounts }}
          SIGNER: ${{ steps.authors.outputs.signer }}
          PR_REF: ${{ github.repository }}#${{ steps.authors.outputs.pr_number }}
          HAS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN != '' }}
        with:
          github-token: ${{ secrets.CLA_SIGNATURES_TOKEN || github.token }}
          script: |
            const owner = process.env.SIGNATURE_OWNER, repo = process.env.SIGNATURE_REPO;
            const branch = process.env.SIGNATURE_BRANCH;
            const accounts = JSON.parse(process.env.ACCOUNTS);
            const signer = JSON.parse(process.env.SIGNER);

            async function readJson(path, empty) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                return { json: JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')), sha: data.sha };
              } catch (e) {
                if (e.status === 404) return { json: empty, sha: null };
                throw e;
              }
            }

            async function ensureBranch() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status !== 404) throw e;
                const { data: r } = await github.rest.repos.get({ owner, repo });
                const { data: base } = await github.rest.git.getRef({ owner, repo, ref: `heads/${r.default_branch}` });
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: base.object.sha });
              }
            }

            const emptyList = { agreement: process.env.AGREEMENT_URL,
                                version: process.env.AGREEMENT_VERSION, signatures: [] };
            let { json: list } = await readJson(process.env.SIGNATURE_FILE, emptyList);
            const { json: entities } = await readJson(process.env.ENTITY_FILE, { entities: [] });

            let saveError = '';
            if (signer && !list.signatures.some(s => String(s.id) === signer.id)) {
              if (process.env.HAS_TOKEN !== 'true') {
                saveError = 'The signature could not be saved, because the token CLA_SIGNATURES_TOKEN is missing. A Refaqt maintainer must add it.';
              } else {
                await ensureBranch();
                for (let attempt = 1; attempt <= 3; attempt++) {
                  const fresh = await readJson(process.env.SIGNATURE_FILE, emptyList);
                  list = fresh.json;
                  if (list.signatures.some(s => String(s.id) === signer.id)) break;
                  list.signatures.push({
                    login: signer.login, id: Number(signer.id),
                    version: process.env.AGREEMENT_VERSION,
                    signed_at: new Date().toISOString(),
                    pull_request: process.env.PR_REF,
                    comment_url: signer.comment_url,
                  });
                  try {
                    await github.rest.repos.createOrUpdateFileContents({
                      owner, repo, branch, path: process.env.SIGNATURE_FILE,
                      message: `${signer.login} accepted the contributor agreement ${process.env.AGREEMENT_VERSION} in ${process.env.PR_REF}`,
                      content: Buffer.from(JSON.stringify(list, null, 2) + '\n').toString('base64'),
                      ...(fresh.sha ? { sha: fresh.sha } : {}),
                    });
                    break;
                  } catch (e) {
                    if (attempt === 3 || (e.status !== 409 && e.status !== 422)) {
                      saveError = `The signature could not be saved (${e.status || ''} ${e.message}).`;
                      list.signatures.pop();
                      break;
                    }
                  }
                }
              }
            }

            const signedIds = new Set(list.signatures
              .filter(s => s.version === process.env.AGREEMENT_VERSION)
              .map(s => String(s.id)));
            for (const ent of entities.entities || [])
              for (const m of ent.members || []) signedIds.add(String(m.id));

            const missing = accounts.filter(a => !signedIds.has(a.id)).map(a => a.login);
            core.setOutput('missing', JSON.stringify(missing));
            core.setOutput('save_error', saveError);

      - name: Report the result on the pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.authors.outputs.pr_number }}
          HEAD_SHA: ${{ steps.authors.outputs.head_sha }}
          MISSING: ${{ steps.signatures.outputs.missing }}
          UNLINKED: ${{ steps.authors.outputs.unlinked }}
          SAVE_ERROR: ${{ steps.signatures.outputs.save_error }}
        with:
          script: |
            const missing = JSON.parse(process.env.MISSING || '[]');
            const unlinked = JSON.parse(process.env.UNLINKED || '[]');
            const ok = missing.length === 0 && unlinked.length === 0;
            const marker = '<!-- refaqt-contributor-agreement -->';

            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA, state: ok ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: ok ? 'Everyone accepted the contributor agreement.'
                              : 'Someone still needs to accept the contributor agreement.',
              target_url: process.env.AGREEMENT_URL,
            });

            let body;
            if (ok) {
              body = `${marker}\n✅ Everyone in this pull request has accepted the [Refaqt Contributor Licence Agreement](${process.env.AGREEMENT_URL}). Thank you.`;
            } else {
              const lines = [marker,
                `Thank you for your contribution. Before we can merge it, everyone who made a commit must accept the [Refaqt Contributor Licence Agreement](${process.env.AGREEMENT_URL}) version ${process.env.AGREEMENT_VERSION}. You do this once, and it covers all Refaqt repositories.`,
                '', 'In plain words: you keep your copyright, and you give Refaqt a licence to use and license your work. The [contributor manual](' + process.env.MANUAL_URL + ') explains it.', ''];
              if (missing.length) {
                lines.push(`Still to accept: ${missing.map(l => '@' + l).join(', ')}`, '',
                  'To accept, post this exact sentence as a new comment on this pull request:', '',
                  '```', process.env.SIGN_SENTENCE, '```', '');
              }
              if (unlinked.length) {
                lines.push('These commits are not linked to a GitHub account, so we cannot check them. Add the email address to your GitHub account, or change the commit author, and push again:', '',
                  ...unlinked.map(u => `- ${u}`), '');
              }
              lines.push(`If you contribute for a company, the company must also sign the [company addendum](${process.env.ENTITY_URL}).`);
              lines.push('', 'Post `recheck` as a comment to run this check again.');
              body = lines.join('\n');
            }
            if (process.env.SAVE_ERROR) body += `\n\n⚠️ ${process.env.SAVE_ERROR}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: Number(process.env.PR_NUMBER), per_page: 100 });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              if (mine.body !== body)
                await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else if (!ok) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: Number(process.env.PR_NUMBER), body });
            }
            if (process.env.SAVE_ERROR) core.setFailed(process.env.SAVE_ERROR);
